url: https://www.elastic.co/guide/en/elasticsearch/reference/current/query-dsl-geo-bounding-box-query.html
doc: |
  Matches geo_point and geo_shape values that intersect a bounding box.
parameters:
  field:
    type: str
    required: True
    doc: |
      The geo_point or geo_shape field you wish to search.
  box:
    type: Mapping[str, Union[str, float, Mapping[str, float], Sequence[float]]]
    required: True
    top_level_field_value: field
    doc: |
      To define the box, provide geopoint values for two opposite corners:
      
      .. CODE::
        
          {"top_left": [-74.1, 40.73], "bottom_right": [-71.12, 40.01]}
      
      or provide values for each of the four corners:

      .. CODE::
        
          {"top": 40.73, "left": -74.1, "bottom": 40.01, "right": -71.12}
      
      The points can accept all formats supported by the
      [geo_point type](https://www.elastic.co/guide/en/elasticsearch/reference/current/geo-point.html):

          - Object format: `{ "lat" : 52.3760, "lon" : 4.894 }` - this is the safest format
          as it is the most explicit about the lat & lon values
          - String format: `"52.3760, 4.894"` - where the first number is the lat and the second is the lon
          - Array format: `[4.894, 52.3760]` - which is based on the GeoJson standard and where
          the first number is the lon and the second one is the lat
      
      Additionally, geohashes can be used. When geohashes are used to specify the bounding the edges of the bounding box, the geohashes are treated as rectangles. The bounding box is defined in such a way that its top left corresponds to the top left corner of the geohash specified in the top_left parameter and its bottom right is defined as the bottom right of the geohash specified in the bottom_right parameter.

      In order to specify a bounding box that would match entire area of a geohash the geohash can be specified in both top_left and bottom_right parameters:
      
      .. CODE::
      
          {"top_left": "dr", "bottom_right": "dr"}
      
      .. NOTE::
        
          Notes on precision:
          
          Geopoints have limited precision and are always rounded down during index time. During the query time, upper boundaries of the bounding boxes are rounded down, while lower boundaries are rounded up. As a result, the points along on the lower bounds (bottom and left edges of the bounding box) might not make it into the bounding box due to the rounding error. At the same time points alongside the upper bounds (top and right edges) might be selected by the query even if they are located slightly outside the edge. The rounding error should be less than 4.20e-8 degrees on the latitude and less than 8.39e-8 degrees on the longitude, which translates to less than 1cm error even at the equator.
    
          Geoshapes also have limited precision due to rounding. Geoshape edges along the bounding box’s bottom and left edges may not match a geo_bounding_box query. Geoshape edges slightly outside the box’s top and right edges may still match the query.

  validation_method:
    type: str
    default: STRICT
    doc: |
      Set to `IGNORE_MALFORMED` to accept geo points with invalid latitude or longitude, set to `COERCE` to additionally try and infer correct coordinates (default is `STRICT`)
  ignore_unmapped:
    type: bool
    default: False
    doc: |
      When set to true the `ignore_unmapped` option will ignore an unmapped field and will not match any documents for this query. This can be useful when querying multiple indexes which might have different mappings. When set to false (the default value) the query will throw an exception if the field is not mapped.
